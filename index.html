<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="assets/css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archived Object Warning Classification</title>
    <script src="assets/js/jquery.js"></script>
</head>

<body>

    <h1>Archived Object Warning Classification</h1>

    <div class="sym-container">
        <div class="sym-canvas">
            <!--This is the base, it always stays-->
            <img id="type" class="sym-layer" src="https://coven.aresmush.com/game/uploads/warning_symbols/type.png">

            <!--This is the symbol in the center-->
            <img id="psychological" class="sym-layer" src="https://coven.aresmush.com/game/uploads/warning_symbols/psychological.png">
            <!--These are the self described classification triangles, rated 1-5. Base name should not change.-->
            <img id="containability_4" class="sym-layer" src="https://coven.aresmush.com/game/uploads/warning_symbols/containability_4.png">
            <img id="ease_of_use_1" class="sym-layer" src="https://coven.aresmush.com/game/uploads/warning_symbols/ease_of_use_1.png">
            <img id="danger_level_2" class="sym-layer" src="https://coven.aresmush.com/game/uploads/warning_symbols/danger_level_2.png">
        </div>
    </div>

</body>

</html>
